name: Website Build

on:
  push:
    branches:
      - main
      - fix/homepage-seo-metadata-20261110
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/website-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".node-version"
      - ".github/workflows/website-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build static website
        run: npm run build
